[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-trainer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11.0,<3.0",
    "requests>=2.33.1,<3.0",
    "numpy>=2.4.4,<3.0",
    "typer>=0.24.1,<1.0",
    "websockets>=16.0,<17.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "black>=26.3.1", "ruff>=0.15.10"]

[project.scripts]
train = "ai_trainer.train:app"
play-vs-ai = "ai_trainer.bot_client:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trainer"]

[tool.pytest.ini_options]
# `src` layout: make the package importable without installing it, so tests run
# with a bare `pytest` in CI and locally.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
# Typer reads a parameter's default to build the CLI: `typer.Option(...)` and
# `typer.Argument(...)` in a default *are* the framework's interface, not the
# accidental-shared-mutable-state that B008 exists to catch. There is no way to
# express a Typer command without them, so they are treated as immutable calls.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.black]
line-length = 100
# requires-python is >=3.11; without this Black assumes the newest grammar it
# knows and its AST safety check then fails on an older interpreter.
target-version = ["py311"]
